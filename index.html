<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REZZ MEDIA — TikTok Downloader</title>
    <meta name="description" content="Download video TikTok tanpa watermark, ekstrak MP3, dan simpan foto slideshow.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e8e8ec;
            --muted: #8a8a95;
            --pink: #fe2c55;
            --cyan: #25f4ee;
            --radius: 16px;
            --brand-grad: linear-gradient(90deg, var(--pink), var(--cyan));
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(254,44,85,0.18), transparent 42%),
                radial-gradient(circle at 80% 80%, rgba(37,244,238,0.14), transparent 42%);
        }

        .container { width: 100%; max-width: 640px; position: relative; z-index: 1; }

        .hero { text-align: center; margin-bottom: 28px; }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--brand-grad);
            border-radius: 12px;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(254,44,85,0.35);
        }
        .logo-text { line-height: 1; }

        .gradient {
            background: var(--brand-grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 420px;
            margin: 0 auto;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-option {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .mode-option:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }
        .mode-option .mode-icon { font-size: 1.6rem; line-height: 1; }
        .mode-option .mode-label { font-size: 0.85rem; font-weight: 600; line-height: 1.2; }
        .mode-option .mode-sub { font-size: 0.7rem; color: var(--muted); font-weight: 400; line-height: 1.3; }

        .mode-option.active {
            background: linear-gradient(135deg, rgba(254,44,85,0.18), rgba(37,244,238,0.12));
            border-color: var(--pink);
            box-shadow: 0 0 0 1px var(--pink), 0 8px 24px rgba(254,44,85,0.2);
        }
        .mode-option.active .mode-label {
            background: var(--brand-grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            backdrop-filter: blur(20px);
            margin-bottom: 16px;
        }

        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }

        #url-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 0;
        }
        #url-input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(254,44,85,0.15);
        }
        #url-input::placeholder { color: var(--muted); }

        .icon-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 16px;
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.08); }

        .primary-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--pink), #ff5c7c);
            border: none;
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, filter 0.2s;
            font-family: inherit;
        }
        .primary-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .error {
            background: rgba(254,44,85,0.12);
            border: 1px solid rgba(254,44,85,0.3);
            color: #ff8899;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .hidden { display: none !important; }

        .loading {
            text-align: center;
            padding: 32px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--pink);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .preview-card {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        #thumbnail {
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .meta { flex: 1; min-width: 0; }
        .meta h3 {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .meta p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

        .actions { display: grid; gap: 10px; }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
            gap: 10px;
        }
        .action-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            transform: translateX(2px);
        }
        .action-btn:disabled { opacity: 0.5; cursor: wait; }

        .action-btn .label {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-btn .label span {
            color: var(--muted);
            font-weight: 400;
            font-size: 0.85rem;
        }
        .action-btn .arrow { color: var(--muted); flex-shrink: 0; }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .photo-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 32px;
            padding: 0 16px;
            line-height: 1.6;
        }
        .brand-line { margin-bottom: 6px; }
        .brand-line strong {
            background: var(--brand-grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            .logo { font-size: 1.7rem; }
            .logo-icon { width: 40px; height: 40px; font-size: 1.3rem; }
            .subtitle { font-size: 0.85rem; }
            #thumbnail { width: 80px; height: 112px; }
            .action-btn { padding: 12px 14px; font-size: 0.9rem; }
            .mode-option { padding: 12px 6px; }
            .mode-option .mode-icon { font-size: 1.3rem; }
            .mode-option .mode-label { font-size: 0.75rem; }
            .mode-option .mode-sub { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <main class="container">
        <header class="hero">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">REZZ<span class="gradient">MEDIA</span></span>
            </div>
            <p class="subtitle">
                Pilih format, tempel link TikTok, langsung unduh.
            </p>
        </header>

        <section class="mode-selector" id="mode-selector">
            <button class="mode-option active" data-mode="video" type="button">
                <span class="mode-icon">🎬</span>
                <span class="mode-label">Video</span>
                <span class="mode-sub">Tanpa watermark</span>
            </button>
            <button class="mode-option" data-mode="audio" type="button">
                <span class="mode-icon">🎵</span>
                <span class="mode-label">MP3</span>
                <span class="mode-sub">Audio asli</span>
            </button>
            <button class="mode-option" data-mode="photo" type="button">
                <span class="mode-icon">🖼</span>
                <span class="mode-label">Foto</span>
                <span class="mode-sub">Slideshow JPG</span>
            </button>
        </section>

        <section class="input-card">
            <div class="input-row">
                <input id="url-input" type="text"
                       placeholder="https://www.tiktok.com/@user/video/..."
                       autocomplete="off" spellcheck="false">
                <button id="paste-btn" class="icon-btn" title="Tempel dari clipboard" type="button">📋</button>
            </div>
            <button id="fetch-btn" class="primary-btn" type="button">
                <span class="btn-text">Ambil Media</span>
            </button>
        </section>

        <div id="error" class="error hidden"></div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loading-text">Memproses...</p>
        </div>

        <section id="result" class="result hidden">
            <div class="preview-card">
                <img id="thumbnail" alt="Preview" onerror="this.style.display='none'">
                <div class="meta">
                    <h3 id="title"></h3>
                    <p id="author"></p>
                    <p id="duration"></p>
                </div>
            </div>
            <div class="actions" id="actions"></div>
        </section>

        <footer class="footer">
            <p class="brand-line">
                <strong>REZZ MEDIA</strong> v1.0
            </p>
            <p>⚠️ Gunakan untuk keperluan pribadi. Hormati hak cipta kreator.</p>
        </footer>
    </main>

    <script>
        // Ganti dengan URL Cloudflare Worker milikmu (tanpa slash di akhir)
        const WORKER_BASE_URL = 'https://rezz-media.eyzz1112.workers.dev';

        const urlInput    = document.getElementById('url-input');
        const fetchBtn    = document.getElementById('fetch-btn');
        const fetchBtnTxt = fetchBtn.querySelector('.btn-text');
        const pasteBtn    = document.getElementById('paste-btn');
        const loading     = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const errorEl     = document.getElementById('error');
        const result      = document.getElementById('result');
        const thumbnail   = document.getElementById('thumbnail');
        const titleEl     = document.getElementById('title');
        const authorEl    = document.getElementById('author');
        const durationEl  = document.getElementById('duration');
        const actions     = document.getElementById('actions');
        const modeOptions = document.querySelectorAll('.mode-option');

        let currentUrl  = '';
        let currentData = null;
        let currentMode = 'video';

        modeOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                modeOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                currentMode = opt.dataset.mode;
                clearError();
                if (currentData) renderResult(currentData);
                else hide(result);
            });
        });

        const show         = el => el.classList.remove('hidden');
        const hide         = el => el.classList.add('hidden');
        const showError    = msg => { errorEl.textContent = msg; show(errorEl); };
        const clearError   = () => hide(errorEl);
        const setLoading   = txt => { loadingText.textContent = txt || 'Memproses...'; show(loading); };
        const unsetLoading = () => hide(loading);

        function formatDuration(sec) {
            if (!sec || sec <= 0) return '';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function fetchInfo() {
            const url = urlInput.value.trim();
            if (!url) return showError('Tempel dulu link TikTok-nya');

            clearError();
            hide(result);
            setLoading('Mengambil info media...');
            fetchBtn.disabled = true;
            fetchBtnTxt.textContent = 'Memproses...';

            try {
                const res = await fetch(`${WORKER_BASE_URL}/api/info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Gagal mengambil info media');
                    return;
                }

                currentUrl  = url;
                currentData = data;
                renderResult(data);
            } catch (e) {
                showError('Koneksi gagal: ' + e.message);
            } finally {
                unsetLoading();
                fetchBtn.disabled = false;
                fetchBtnTxt.textContent = 'Ambil Media';
            }
        }

        function renderResult(data) {
            clearError();

            if (data.thumbnail) {
                thumbnail.src = data.thumbnail;
                thumbnail.style.display = '';
            } else {
                thumbnail.style.display = 'none';
            }

            titleEl.textContent = data.title || 'Tanpa judul';
            authorEl.textContent = data.author ? `@${data.author.replace(/^@/, '')}` : '';

            const dur = formatDuration(data.duration);
            durationEl.textContent = dur ? `⏱ ${dur}` : '';

            actions.innerHTML = '';

            if (currentMode === 'video') {
                if (data.has_video) {
                    actions.appendChild(makeBtn('🎬 Video MP4', 'Tanpa watermark', 'video'));
                } else {
                    hide(result);
                    showError('❌ Postingan ini bukan video. Coba pilih mode Foto.');
                    return;
                }
            } else if (currentMode === 'audio') {
                if (data.ffmpeg) {
                    actions.appendChild(makeBtn('🎵 Audio MP3', 'Unduh audio', 'audio'));
                } else {
                    hide(result);
                    showError('❌ Audio tidak tersedia untuk postingan ini.');
                    return;
                }
            } else if (currentMode === 'photo') {
                if (Array.isArray(data.photos) && data.photos.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'photo-grid';
                    data.photos.forEach((url, i) => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = `Foto ${i + 1}`;
                        img.loading = 'lazy';
                        grid.appendChild(img);
                    });
                    actions.appendChild(grid);

                    data.photos.forEach((_, i) => {
                        actions.appendChild(makeBtn(`🖼 Foto ${i + 1}`, 'Download JPG', 'photo', i));
                    });
                } else {
                    hide(result);
                    showError('❌ Postingan ini bukan slideshow foto. Coba pilih mode Video.');
                    return;
                }
            }

            show(result);
        }

        function makeBtn(label, desc, type, index = null) {
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.type = 'button';
            btn.innerHTML = `
                <span class="label">${label} <span>${desc}</span></span>
                <span class="arrow">Unduh →</span>
            `;
            btn.addEventListener('click', () => downloadMedia(type, index, btn));
            return btn;
        }

        async function downloadMedia(type, index, btn) {
            if (!currentUrl) return;

            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="label">⏳ Menyiapkan...</span>`;
            clearError();

            try {
                const res = await fetch(`${WORKER_BASE_URL}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: currentUrl, type, index })
                });

                if (!res.ok) {
                    let msg = 'Download gagal';
                    try { const err = await res.json(); msg = err.error || msg; } catch {}
                    showError(msg);
                    return;
                }

                const blob = await res.blob();
                const cd = res.headers.get('Content-Disposition') || '';
                const match = cd.match(/filename="([^"]+)"/);
                const fallbackExt = type === 'audio' ? 'mp3' : type === 'video' ? 'mp4' : 'jpg';
                const filename = match ? match[1] : `rezz_${type}.${fallbackExt}`;

                triggerDownload(blob, filename);
            } catch (e) {
                showError('Download error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                urlInput.value = text.trim();
                urlInput.focus();
            } catch {
                showError('Clipboard tidak bisa diakses — tempel manual ya');
            }
        });

        urlInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') fetchInfo();
        });

        fetchBtn.addEventListener('click', fetchInfo);
    </script>

  };
</script>
